name: Build libmpv gpu-next (Linux x86_64)

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag for the uploaded libmpv bundle'
        required: true
        default: 'v0.41.0-zcopy'
      mpv_repository:
        description: 'mpv repository to build'
        required: true
        default: 'https://github.com/ha1o0/mpv.git'
      mpv_ref:
        description: 'mpv branch, tag, or commit'
        required: true
        default: 'zcopy'
      archive_name:
        description: 'Output archive base name'
        required: true
        default: 'libmpv-linux-x86_64-gpu-next'

permissions:
  contents: write

jobs:
  build:
    name: Build Linux x86_64 bundle
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout mpv-build
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            curl \
            file \
            git \
            glslang-tools \
            libasound2-dev \
            libdrm-dev \
            libegl1-mesa-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libfribidi-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libharfbuzz-dev \
            libjpeg-dev \
            liblcms2-dev \
            libnghttp2-dev \
            libpulse-dev \
            libpsl-dev \
            libbrotli-dev \
            libzstd-dev \
            libssh2-1-dev \
            libssl-dev \
            libtool \
            libva-dev \
            libvdpau-dev \
            libvulkan-dev \
            libx11-dev \
            libx264-dev \
            libxv-dev \
            nasm \
            patchelf \
            pkg-config \
            python3-pip \
            python3-setuptools \
            zlib1g-dev \
            glslang-dev \
            spirv-tools \
            yasm \
            zstd

      - name: Install Meson and Ninja
        run: |
          sudo apt-get remove -y meson ninja-build || true
          python3 -m pip install --upgrade pip
          sudo pip3 install meson ninja
          echo "/usr/local/bin" >> "$GITHUB_PATH"
          meson --version
          ninja --version

      - name: Fetch, patch, build and verify zcopy
        env:
          MPV_REPOSITORY: ${{ github.event.inputs.mpv_repository }}
          MPV_REF: ${{ github.event.inputs.mpv_ref }}
        run: |
          bash scripts/build-linux-zcopy

      - name: Package libmpv bundle
        env:
          ARCHIVE_NAME: ${{ github.event.inputs.archive_name }}
        run: |
          export LD_LIBRARY_PATH="$PWD/build_libs/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          chmod +x scripts/package-libmpv-bundle
          ./scripts/package-libmpv-bundle x86_64 "$ARCHIVE_NAME" output zcopy
          cp "output/$ARCHIVE_NAME/lib/libmpv.so.2" output/libmpv-amd64.so
          ldd "output/$ARCHIVE_NAME/lib/libmpv.so.2"
          cat "output/$ARCHIVE_NAME/manifest.txt"
          cat "output/$ARCHIVE_NAME.tar.zst.sha256"
          env -u LD_LIBRARY_PATH python3 tests/test_libmpv_playback.py --library "output/$ARCHIVE_NAME/lib/libmpv.so.2" --fixture build-linux-validation/media --case http-mp4 --case hls-encrypted --curl auto --output-dir build-linux-validation

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.inputs.archive_name }}
          path: |
            output/${{ github.event.inputs.archive_name }}.tar.zst
            output/${{ github.event.inputs.archive_name }}.tar.zst.sha256
            output/libmpv-amd64.so

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-zcopy-validation
          if-no-files-found: ignore
          path: |
            build-linux-validation/
            mpv/build/meson-logs/
            mpv/build/meson-info/intro-dependencies.json
            build-linux-curl/build/CMakeCache.txt

      - name: Create release and upload
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag }}
          name: Release ${{ github.event.inputs.release_tag }}
          files: |
            output/${{ github.event.inputs.archive_name }}.tar.zst
            output/${{ github.event.inputs.archive_name }}.tar.zst.sha256
            output/libmpv-amd64.so
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
